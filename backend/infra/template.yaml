AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Precedent - grounds AWS architecture connections in real deployable patterns.
  SHIP IT track. This stack is itself audited by the tool it deploys.

Parameters:
  CorpusCommit:
    Type: String
    Default: unknown
    Description: Pinned serverless-patterns commit the edge table was built from.
  BedrockBaseUrl:
    Type: String
    Default: https://bedrock-mantle.ap-south-1.api.aws/v1
    Description: OpenAI-compatible endpoint. These models are not on bedrock-runtime.
  BedrockModel:
    Type: String
    Default: zai.glm-4.7-flash
    Description: Pinned by the Stage 7 bake-off. See TRACKING.md section 4.

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 15
    Tracing: Active
    Environment:
      Variables:
        CORPUS_COMMIT: !Ref CorpusCommit
        DDB_TABLE_EDGES: !Ref EdgesTable
        DDB_TABLE_PATTERNS: !Ref PatternsTable
        DDB_TABLE_AUDITS: !Ref AuditsTable
        ARTIFACTS_BUCKET: !Ref ArtifactsBucket

Resources:

  # ---- API surface ------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: v1
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: ['content-type']
        AllowMethods: [GET, POST, OPTIONS]
      # A public URL with a model behind it and no limit is an invitation.
      # HTTP APIs throttle via route settings; Throttle is a REST-API property.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  # ---- Functions --------------------------------------------------------
  # Two functions, deliberately. Prose extraction can be slow and can fail;
  # audits must be fast and must never fail because a model is unavailable.
  # Keeping them apart means a Bedrock outage degrades one tab, not the product.

  AuditFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../build/lambda/
      Handler: handler_audit.handler
      Description: Deterministic audit. Never calls a model.
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EdgesTable
        - DynamoDBReadPolicy:
            TableName: !Ref PatternsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditsTable
        - S3ReadPolicy:
            BucketName: !Ref ArtifactsBucket
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
        CorpusStats:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /corpus/stats
            Method: GET
        Rules:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /rules
            Method: GET
        PatternDetail:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /patterns/{patternId}
            Method: GET
        CreateAudit:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /audits
            Method: POST
        GetAudit:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /audits/{auditId}
            Method: GET

  ExtractFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../build/lambda/
      Handler: handler_extract.handler
      Description: Prose extraction, audit review and Q&A. The only function that calls a model.
      Timeout: 29          # must stay under the API Gateway integration limit
      MemorySize: 512
      Environment:
        Variables:
          BEDROCK_API_KEY_SECRET: !Ref BedrockApiKey
          BEDROCK_BASE_URL: !Ref BedrockBaseUrl
          BEDROCK_MODEL: !Ref BedrockModel
          LLM_TIMEOUT_S: '25'
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref BedrockApiKey
        # Review and Q&A read the saved report by id; they never write to it.
        - DynamoDBReadPolicy:
            TableName: !Ref AuditsTable
      Events:
        Extract:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /extract
            Method: POST
        ExtractHealth:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /extract/health
            Method: GET
        ReviewAudit:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /audits/{auditId}/review
            Method: POST
        AskAudit:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /audits/{auditId}/ask
            Method: POST

  # The key is never an environment variable and never in the repo.
  # Its value is set out of band; see TRACKING.md.
  BedrockApiKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Bedrock mantle API key for prose extraction.
      SecretString: '{"api_key":"REPLACE_ME"}'

  # ---- Data -------------------------------------------------------------
  # PK is "<src>#<dst>" so grounding is one GetItem per edge, which keeps
  # audit latency independent of corpus size.
  EdgesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pair
          AttributeType: S
      KeySchema:
        - AttributeName: pair
          KeyType: HASH

  PatternsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pattern_id
          AttributeType: S
      KeySchema:
        - AttributeName: pattern_id
          KeyType: HASH

  AuditsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: audit_id
          AttributeType: S
      KeySchema:
        - AttributeName: audit_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

Outputs:
  ApiUrl:
    Description: Public base URL of the API.
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/v1'
  HealthUrl:
    Description: Smoke-test endpoint.
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/v1/health'
  EdgesTableName:
    Value: !Ref EdgesTable
  PatternsTableName:
    Value: !Ref PatternsTable
  AuditsTableName:
    Value: !Ref AuditsTable
  ArtifactsBucketName:
    Value: !Ref ArtifactsBucket
  BedrockSecretArn:
    Description: Put the Bedrock API key here; it is created with a placeholder.
    Value: !Ref BedrockApiKey
